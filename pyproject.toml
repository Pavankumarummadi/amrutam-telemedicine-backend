[project]
name = "amrutam-telemedicine"
version = "1.0.0"
description = "Production-grade telemedicine backend reference implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.12,<1",
  "prometheus-fastapi-instrumentator>=7,<8",
  "redis>=5,<6",
  "alembic>=1.14,<2",
  "email-validator>=2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
